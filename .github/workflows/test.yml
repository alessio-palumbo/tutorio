name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cmd/app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: cmd/app/frontend
        run: npm ci

      - name: Build frontend
        working-directory: cmd/app/frontend
        run: npm run build

      - name: Test Go
        run: go test ./...
